<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CampusDuka | Products</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
:root{
  --color-charcoal:#1f2d3d;
  --color-slate-teal:#164e63;
  --color-medium-teal:#1f6b88;
  --color-accent-blue:#4589be;
  --bg-main:#f8fafc;
  --text-dark:#1f2d3d;
  --text-muted:#64748b;
  --card-bg:#ffffff;
  --border-light:#e2e8f0;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05);
  --shadow-md:0 4px 6px -1px rgba(31,45,61,0.08),0 2px 4px -1px rgba(31,45,61,0.04);
  --shadow-lg:0 10px 20px -3px rgba(31,45,61,0.12),0 4px 6px -4px rgba(31,45,61,0.08);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg-main);color:var(--text-dark);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--color-accent-blue);outline-offset:2px}

/* NAVBAR */
.navbar{background:var(--color-charcoal);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 5%;height:70px;position:sticky;top:0;z-index:1000;border-bottom:2px solid var(--color-slate-teal);box-shadow:0 4px 15px rgba(0,0,0,0.15)}
.logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-img{height:44px;width:auto;display:block}
.logo-fallback{display:none;align-items:center;gap:10px}
.logo-svg{height:38px;width:auto}
.logo-text{color:#fff;font-size:22px;font-weight:800;letter-spacing:-0.5px}
.logo-text span{color:var(--color-accent-blue)}
.nav-links{display:flex;gap:8px;list-style:none;margin:0 auto 0 24px;padding:0}
.nav-links a{color:rgba(255,255,255,0.8);text-decoration:none;font-weight:500;font-size:14px;padding:9px 16px;border-radius:10px;display:block;transition:all .2s}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.08)}
.nav-links a.active{color:#fff;background:var(--color-slate-teal)}
.menu-icon{display:none;color:#fff;font-size:22px;cursor:pointer}
.cart-link{position:relative;color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;background:var(--color-slate-teal);padding:10px 18px;border-radius:30px;font-size:14px;font-weight:600;transition:background .2s}
.cart-link:hover{background:var(--color-medium-teal)}
.cart-link i{font-size:18px}
#cart-count{background:#ef4444;color:#fff;border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-size:11px;font-weight:700}
.cart-link.bump{animation:bump .5s}
.cart-link.ring::after{content:"";position:absolute;inset:-5px;border-radius:34px;border:2px solid var(--color-accent-blue);animation:ring 1s ease-out 2}
@keyframes bump{30%{transform:scale(1.15)}60%{transform:scale(.95)}}
@keyframes ring{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.2)}}
.cart-tip{position:absolute;top:calc(100% + 14px);right:0;background:#fff;color:var(--text-dark);font-size:12px;font-weight:500;padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-tip::before{content:"";position:absolute;top:-6px;right:34px;width:12px;height:12px;background:#fff;transform:rotate(45deg)}
.cart-tip.show{opacity:1}

/* HERO SLIDER */
.hero{max-width:1200px;margin:24px auto 0;padding:0 20px}
.slider{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--color-charcoal),var(--color-slate-teal));color:#fff;min-height:300px;box-shadow:var(--shadow-lg)}
.slide{display:none;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding:36px 56px;min-height:300px}
.slide.on{display:grid;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide .tag{display:inline-block;background:rgba(255,255,255,0.15);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:14px}
.slide h2{font-size:32px;font-weight:800;margin:0 0 10px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide p{margin:0 0 20px;color:rgba(255,255,255,0.8);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .price-big{font-size:26px;font-weight:800;margin-bottom:18px}
.slide .cta{background:#fff;color:var(--color-slate-teal);border:none;padding:12px 26px;border-radius:30px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .2s}
.slide .cta:hover{transform:translateY(-2px)}
.slide .pic{height:240px;display:flex;align-items:center;justify-content:center}
.slide .pic img{max-width:100%;max-height:240px;object-fit:contain;border-radius:16px;background:rgba(255,255,255,0.95);padding:10px;box-shadow:0 12px 30px rgba(0,0,0,0.3)}
.s-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.18);border:none;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:14px}
.s-arrow:hover{background:rgba(255,255,255,0.35)}
.s-prev{left:12px}.s-next{right:12px}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dots button{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,0.4);cursor:pointer;padding:0}
.dots button.on{background:#fff;width:24px;border-radius:6px}

/* SEARCH */
.search-section{max-width:760px;margin:30px auto 0;padding:0 20px}
.search-box{display:flex;background:#fff;padding:6px;border-radius:50px;box-shadow:var(--shadow-md);border:1px solid var(--border-light);align-items:center}
.search-box:focus-within{border-color:var(--color-slate-teal);box-shadow:0 0 0 3px rgba(22,78,99,0.15)}
.search-box i.search-field-icon{margin-left:20px;color:var(--text-muted)}
.search-box input{flex:1;min-width:0;padding:12px 14px;border:none;outline:none;font-family:inherit;font-size:15px;background:transparent;color:var(--text-dark)}
.search-clear{display:none;border:none;background:var(--border-light);color:var(--text-muted);width:30px;height:30px;border-radius:50%;cursor:pointer;margin-right:6px}
.search-clear.show{display:block}

/* CATEGORIES */
.category-nav{display:flex;gap:10px;margin:22px auto 8px;padding:4px 20px 8px;max-width:1200px;overflow-x:auto;scrollbar-width:thin}
.cat-btn{background:#fff;color:var(--text-dark);border:1px solid var(--border-light);padding:9px 18px;border-radius:30px;cursor:pointer;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:all .2s}
.cat-btn .n{background:var(--bg-main);color:var(--text-muted);font-size:11px;padding:1px 8px;border-radius:20px}
.cat-btn:hover,.cat-btn.active{background:var(--color-slate-teal);color:#fff;border-color:var(--color-slate-teal)}
.cat-btn.active .n{background:rgba(255,255,255,0.2);color:#fff}

/* CONTROL STRIP & SECTION TITLES */
.results-info-strip{max-width:1200px;margin:10px auto 18px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--text-muted)}
.results-info-strip strong{color:var(--text-dark)}
.sort-container{display:flex;align-items:center;gap:8px}
.sort-select{border:1px solid var(--border-light);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:13px;color:var(--text-dark);background:#fff;cursor:pointer}
.section-title{max-width:1200px;margin:10px auto 14px;padding:0 20px;font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px}
.section-title i{color:var(--color-accent-blue)}
.strip{max-width:1200px;margin:0 auto 26px;padding:4px 20px 14px;display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity}
.strip .product-card{min-width:240px;max-width:240px;scroll-snap-align:start}

/* PRODUCT GRID */
.products-container{max-width:1200px;margin:0 auto;padding:0 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.product-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);display:flex;flex-direction:column;position:relative;transition:transform .25s,box-shadow .25s}
.product-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.badges{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:5;align-items:flex-start}
.badge{color:#fff;padding:4px 10px;font-size:11px;font-weight:700;border-radius:6px}
.b-new{background:var(--color-slate-teal)}.b-low{background:#f59e0b}.b-out{background:#64748b}.b-cond{background:var(--color-accent-blue)}
.img-wrapper{width:100%;height:210px;overflow:hidden;background:#f1f5f9;cursor:pointer;position:relative}
.img-wrapper img{width:100%;height:100%;object-fit:contain;transition:transform .35s}
.product-card:hover .img-wrapper img{transform:scale(1.05)}
.card-details{padding:16px 18px 18px;display:flex;flex-direction:column;flex-grow:1}
.cat-label{font-size:11px;font-weight:600;color:var(--color-medium-teal);margin-bottom:4px}
.product-card h3{margin:0 0 6px;font-size:15px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;line-height:1.4}
.product-price{color:var(--color-slate-teal);font-weight:800;font-size:20px;margin:0 0 8px}
.mini-opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;min-height:22px}
.swatch{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,0.2);display:inline-block}
.mini-size{font-size:10px;font-weight:600;border:1px solid var(--border-light);padding:2px 6px;border-radius:5px;color:var(--text-muted)}
.mini-more{font-size:11px;color:var(--text-muted)}
.card-actions{display:grid;grid-template-columns:44px 1fr;gap:8px;margin-top:auto}
.bn{border:none;padding:11px 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.bn-view{background:#f1f5f9;color:var(--text-dark);border:1px solid var(--border-light)}
.bn-view:hover{background:#e2e8f0}
.bn-add{background:var(--color-slate-teal);color:#fff}
.bn-add:hover{background:var(--color-medium-teal)}
.bn:disabled{background:#cbd5e1;color:#fff;cursor:not-allowed}

/* NO RESULTS & SKELETON */
.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);background:#fff;border-radius:var(--radius-lg);border:1px dashed var(--border-light)}
.no-results i{font-size:46px;margin-bottom:14px;opacity:.5}
.no-results h3{color:var(--text-dark);margin:0 0 8px}
.no-results button{margin-top:14px;background:var(--color-slate-teal);color:#fff;padding:9px 22px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;border:none;cursor:pointer}
.skel{height:380px;border-radius:16px;background:linear-gradient(90deg,#eef2f7 25%,#f8fafc 50%,#eef2f7 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:var(--color-charcoal);color:#fff;padding:12px 14px 12px 20px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;opacity:0;visibility:hidden;z-index:3000;transition:all .35s;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast i{color:#10b981}
.toast a{background:var(--color-accent-blue);color:#fff;text-decoration:none;padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap}
.fly{position:fixed;z-index:4000;width:60px;height:60px;object-fit:cover;border-radius:12px;pointer-events:none;box-shadow:var(--shadow-lg);transition:all .75s cubic-bezier(.5,-.2,.7,1)}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:2000;padding:16px}
.modal-content{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:880px;max-height:92vh;overflow-y:auto;position:relative;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25)}
.close-btn{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;border:none;background:#fff;font-size:20px;cursor:pointer;color:var(--text-muted);z-index:5;box-shadow:var(--shadow-md)}
.gallery{padding:24px;background:#f1f5f9}
#mainImage{width:100%;height:340px;object-fit:contain;border-radius:var(--radius-md);background:#fff;display:block}
.thumbnail-container{margin-top:12px;display:flex;justify-content:center;gap:8px}
.thumbnail-container img{width:64px;height:64px;cursor:pointer;border-radius:var(--radius-sm);object-fit:contain;background:#fff;border:2px solid transparent}
.thumbnail-container img.on{border-color:var(--color-slate-teal)}
.modal-info{padding:28px 28px 24px}
.modal-info h3{margin:0 0 6px;font-size:22px;font-weight:700;padding-right:30px}
.modal-price{color:var(--color-slate-teal);font-weight:800;font-size:24px;margin-bottom:10px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.meta-row span{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(69,137,190,0.15);color:var(--color-medium-teal)}
.modal-desc{color:var(--text-muted);font-size:13px;line-height:1.7;white-space:pre-line;word-break:break-word;margin-bottom:18px;max-height:110px;overflow-y:auto}
.opt-label{font-size:13px;font-weight:700;margin:0 0 8px}
.opt-label small{font-weight:500;color:var(--text-muted)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{min-width:44px;text-align:center;padding:8px 14px;border:1.5px solid var(--border-light);border-radius:10px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:all .15s}
.chip:hover{border-color:var(--color-medium-teal)}
.chip.on{background:var(--color-slate-teal);border-color:var(--color-slate-teal);color:#fff}
.chip .dot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,0.25)}
.opt-err{color:#dc2626;font-size:12px;font-weight:600;margin:-8px 0 12px;display:none}
.opt-row.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.buy-row{display:flex;gap:12px;align-items:center;margin-top:6px}
.qty{display:flex;align-items:center;border:1.5px solid var(--border-light);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:42px;border:none;background:#f8fafc;cursor:pointer;font-size:16px;font-weight:700}
.qty button:hover{background:var(--border-light)}
.qty span{min-width:34px;text-align:center;font-weight:700;font-size:14px}
.modal-add{flex:1;padding:13px}
.stock-note{font-size:12px;color:#d97706;font-weight:600;margin-top:10px}

footer{background:var(--color-charcoal);color:#fff;padding:35px 20px;text-align:center;font-size:14px;border-top:3px solid var(--color-slate-teal)}

@media(max-width:820px){
  .slide{grid-template-columns:1fr;padding:28px 24px 44px;text-align:center}
  .slide .pic{order:-1;height:150px}.slide .pic img{max-height:150px}
  .slide h2{font-size:22px}
  .s-arrow{display:none}
  .modal-content{grid-template-columns:1fr}
  #mainImage{height:240px}
}
@media(max-width:768px){
  .navbar{padding:0 16px;height:64px}
  .menu-icon{display:block;order:3}
  .nav-links{display:none;position:absolute;top:64px;left:0;width:100%;background:var(--color-charcoal);flex-direction:column;padding:16px;gap:6px;margin:0;border-bottom:2px solid var(--color-slate-teal)}
  .nav-links.active{display:flex}
  .nav-links a{text-align:center}
  .cart-label{display:none}
  .cart-link{padding:10px 14px;margin-left:auto}
  .logo-img{height:38px}
  .products-container{grid-template-columns:repeat(2,1fr);gap:14px}
  .img-wrapper{height:150px}
  .card-details{padding:12px}
  .product-price{font-size:16px}
  .strip .product-card{min-width:190px;max-width:190px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<nav class="navbar">
  <a href="index2.html" class="logo-link" aria-label="CampusDuka home">
    <img src="images/logo.png" alt="CampusDuka Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
    <span id="logoFallback" class="logo-fallback">
      <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#164e63"/><stop offset="100%" stop-color="#4589be"/></linearGradient></defs>
        <rect x="20" y="25" width="60" height="50" rx="8" fill="url(#logo-grad)"/>
        <polygon points="50,15 20,25 80,25" fill="#ffffff"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
        <path d="M44,50 L56,50 M50,44 L50,56" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Campus<span>Duka</span></span>
    </span>
  </a>

  <ul class="nav-links" id="navLinks">
    <li><a href="index2.html">Home</a></li>
    <li><a href="products.html" class="active">Products</a></li>
    <li><a href="food.html">Fast Foods</a></li>
    <li><a href="events.html">Events</a></li>
  </ul>

  <a href="cart.html" class="cart-link" id="cartLink" aria-label="Open your cart">
    <i class="fas fa-shopping-cart"></i><span class="cart-label">Cart</span>
    <span id="cart-count">0</span>
    <span class="cart-tip" id="cartTip">Your items are saved here</span>
  </a>
  <div class="menu-icon" id="menuIcon" aria-label="Menu"><i class="fas fa-bars"></i></div>
</nav>

<section class="hero" id="hero" style="display:none">
  <div class="slider" id="slider"></div>
</section>

<section class="search-section">
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass search-field-icon"></i>
    <input id="searchInput" type="search" placeholder="Search products, categories, sizes or colours..." autocomplete="off" oninput="onSearch()">
    <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
  </div>
</section>

<div class="category-nav" id="categoryNav"></div>

<div id="freshSection" style="display:none">
  <h2 class="section-title"><i class="fa-solid fa-bolt"></i> Just added</h2>
  <div class="strip" id="freshStrip"></div>
</div>

<div class="results-info-strip">
  <div>
    <span id="itemsCounter">Loading items...</span>
    <span id="currentFiltersApplied" style="margin-left:10px;"></span>
  </div>
  <div class="sort-container">
    <label for="sortDropdown">Sort by:</label>
    <select id="sortDropdown" class="sort-select" onchange="evaluateActiveFilters()">
      <option value="newest">Newest first</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
    </select>
  </div>
</div>

<div class="products-container" id="product-container">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div>

<!-- PRODUCT VIEW MODAL -->
<div class="modal" id="viewModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
    <div class="gallery">
      <img id="mainImage" alt="Product image">
      <div class="thumbnail-container" id="thumbnails"></div>
    </div>
    <div class="modal-info">
      <h3 id="modalName"></h3>
      <div class="modal-price" id="modalPrice"></div>
      <div class="meta-row" id="modalMeta"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div id="sizeBlock" style="display:none">
        <p class="opt-label">Size <small>(choose one)</small></p>
        <div class="opt-row" id="sizeRow"></div>
        <div class="opt-err" id="sizeErr">Please choose a size.</div>
      </div>
      <div id="colorBlock" style="display:none">
        <p class="opt-label">Colour: <small id="colorName">choose one</small></p>
        <div class="opt-row" id="colorRow"></div>
        <div class="opt-err" id="colorErr">Please choose a colour.</div>
      </div>
      <div class="buy-row">
        <div class="qty"><button onclick="changeQty(-1)" aria-label="Less">-</button><span id="qtyVal">1</span><button onclick="changeQty(1)" aria-label="More">+</button></div>
        <button class="bn bn-add modal-add" id="modalAddBtn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
      </div>
      <div class="stock-note" id="stockNote"></div>
    </div>
  </div>
</div>

<div class="toast" id="toastNotice">
  <i class="fa-solid fa-circle-check"></i>
  <span id="toastMessage">Item added to cart</span>
  <a href="cart.html">View cart</a>
</div>

<footer>&copy; 2026 CampusDuka • All Rights Reserved</footer>

<script>
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#f1f5f9"/><text x="50%" y="52%" font-family="Arial" font-size="16" fill="#94a3b8" text-anchor="middle">No image</text></svg>');
const CATEGORIES = [
  ["All","fa-cubes"],["Electronics","fa-laptop"],["Clothes","fa-shirt"],["Household","fa-house-user"],
  ["Study Materials","fa-book-open"],["Beauty & Care","fa-spray-can-sparkles"],["Sports & Outdoors","fa-basketball"],
  ["Gaming","fa-gamepad"],["Tools & Equipment","fa-screwdriver-wrench"],["Others","fa-box"]
];

let allProducts = [];
let selectedCategory = "All";
let current = null;      // product open in the modal
let pick = { size:null, color:null, qty:1 };
let slideIdx = 0, slideTimer = null, searchTimer = null;

const menuIcon = document.getElementById("menuIcon");
const navLinks = document.getElementById("navLinks");
menuIcon.onclick = () => navLinks.classList.toggle("active");

function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ return Number(n || 0).toLocaleString(); }

/* ---------- NORMALISE DATA FROM THE SERVER ---------- */
function toList(v){
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (typeof v === "string"){
    const s = v.trim();
    if (s.startsWith("[")) { try { return JSON.parse(s); } catch(e){} }
    return s.replace(/^\{|\}$/g,"").split(",").map(x => x.replace(/^"|"$/g,"").trim()).filter(Boolean);
  }
  return [];
}
function normalize(p){
  p.images = toList(p.images).map(i => typeof i === "string" ? i.replace(/^"|"$/g,"") : i).filter(Boolean);
  p.sizes = toList(p.sizes).map(String);
  p.colors = toList(p.colors).map(c => {
    if (typeof c === "string"){ const t = c.trim(); if (t.startsWith("{")) { try { c = JSON.parse(t); } catch(e){} } }
    return typeof c === "string" ? { name:c, hex:c.toLowerCase() } : { name:c.name, hex:c.hex || String(c.name).toLowerCase() };
  }).filter(c => c.name);
  p.price = Number(p.price) || 0;
  p.stockNum = (p.stock === undefined || p.stock === null || p.stock === "") ? null : Number(p.stock);
  return p;
}
const hasOptions = p => p.sizes.length > 0 || p.colors.length > 0;
const firstImg = p => p.images[0] || PLACEHOLDER;

/* ---------- CART ---------- */
function getCart(){ try { return JSON.parse(localStorage.getItem("cart")) || []; } catch(e){ return []; } }

function updateCartCount(){
  const count = getCart().reduce((s,i) => s + (i.quantity || 0), 0);
  document.getElementById("cart-count").innerText = count;
}

function showToast(message){
  const toast = document.getElementById("toastNotice");
  document.getElementById("toastMessage").innerText = message;
  toast.classList.add("show");
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => toast.classList.remove("show"), 3500);
}

// Fly a copy of the product photo to the cart icon, then pulse the icon
function flyToCart(srcEl, imgSrc){
  const link = document.getElementById("cartLink");
  link.classList.remove("bump"); void link.offsetWidth; link.classList.add("bump");
  if (!sessionStorage.getItem("cartTipSeen")){
    sessionStorage.setItem("cartTipSeen","1");
    link.classList.add("ring");
    const tip = document.getElementById("cartTip");
    tip.classList.add("show");
    setTimeout(() => { tip.classList.remove("show"); link.classList.remove("ring"); }, 3500);
  }
  if (!srcEl) return;
  const a = srcEl.getBoundingClientRect(), b = link.getBoundingClientRect();
  const f = document.createElement("img");
  f.src = imgSrc; f.className = "fly";
  f.style.left = (a.left + a.width/2 - 30) + "px";
  f.style.top = (a.top + a.height/2 - 30) + "px";
  document.body.appendChild(f);
  requestAnimationFrame(() => {
    f.style.left = (b.left + b.width/2 - 15) + "px";
    f.style.top = (b.top + b.height/2 - 15) + "px";
    f.style.width = f.style.height = "30px";
    f.style.opacity = ".4";
  });
  setTimeout(() => f.remove(), 800);
}

// Each size/colour combination is its own cart line, so a Black M and a Black L stay separate
function addToCart(p, size, color, qty, srcEl){
  let cart = getCart();
  const idx = cart.findIndex(i => String(i.id) === String(p.id) && (i.size || null) === (size || null) && (i.color || null) === (color || null));
  const label = [size ? "Size " + size : "", color || ""].filter(Boolean).join(", ");
  const displayName = label ? `${p.name} (${label})` : p.name;
  if (idx > -1){
    cart[idx].quantity += qty;
  } else {
    cart.push({ id:p.id, seller_id:p.seller_id, name:displayName, baseName:p.name, price:p.price, image:firstImg(p), quantity:qty, size:size || null, color:color || null });
  }
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
  flyToCart(srcEl, firstImg(p));
  showToast(`${displayName} added to cart`);
}

// Card button: add straight away when there are no options, else open the picker
function quickAdd(id, btn){
  const p = allProducts.find(x => String(x.id) === String(id));
  if (!p) return;
  if (hasOptions(p)) { openProduct(id); return; }
  const img = btn.closest(".product-card").querySelector("img");
  addToCart(p, null, null, 1, img);
}

/* ---------- MODAL ---------- */
function openProduct(id){
  const p = allProducts.find(x => String(x.id) === String(id));
  if (!p) return;
  current = p;
  pick = { size:null, color:null, qty:1 };
  const imgs = p.images.length ? p.images : [PLACEHOLDER];
  const main = document.getElementById("mainImage");
  main.src = imgs[0];
  const thumbs = document.getElementById("thumbnails");
  thumbs.innerHTML = "";
  if (imgs.length > 1) imgs.forEach((src, i) => {
    const t = document.createElement("img");
    t.src = src; if (i === 0) t.className = "on";
    t.onclick = () => { main.src = src; thumbs.querySelectorAll("img").forEach(x => x.classList.remove("on")); t.classList.add("on"); };
    thumbs.appendChild(t);
  });

  document.getElementById("modalName").textContent = p.name;
  document.getElementById("modalPrice").textContent = `KES ${money(p.price)}`;
  document.getElementById("modalDesc").textContent = p.description || "No description available for this campus item.";
  document.getElementById("modalMeta").innerHTML = [p.category, p.condition].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join("");

  const sizeRow = document.getElementById("sizeRow");
  document.getElementById("sizeBlock").style.display = p.sizes.length ? "block" : "none";
  sizeRow.innerHTML = "";
  p.sizes.forEach(s => {
    const c = document.createElement("div");
    c.className = "chip"; c.textContent = s;
    c.onclick = () => { pick.size = s; sizeRow.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); document.getElementById("sizeErr").style.display = "none"; };
    sizeRow.appendChild(c);
  });

  const colorRow = document.getElementById("colorRow");
  document.getElementById("colorBlock").style.display = p.colors.length ? "block" : "none";
  document.getElementById("colorName").textContent = "choose one";
  colorRow.innerHTML = "";
  p.colors.forEach(col => {
    const c = document.createElement("div");
    c.className = "chip";
    c.innerHTML = `<span class="dot" style="background:${esc(col.hex)}"></span>${esc(col.name)}`;
    c.onclick = () => { pick.color = col.name; colorRow.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); document.getElementById("colorName").textContent = col.name; document.getElementById("colorErr").style.display = "none"; };
    colorRow.appendChild(c);
  });

  document.getElementById("qtyVal").textContent = 1;
  const out = p.stockNum === 0;
  const btn = document.getElementById("modalAddBtn");
  btn.disabled = out;
  btn.innerHTML = out ? "Sold out" : '<i class="fa-solid fa-cart-plus"></i> Add to Cart';
  document.getElementById("stockNote").textContent = (p.stockNum !== null && p.stockNum > 0 && p.stockNum <= 5) ? `Only ${p.stockNum} left in stock` : "";

  btn.onclick = () => {
    let ok = true;
    if (p.sizes.length && !pick.size){ ok = false; flagMissing("size"); }
    if (p.colors.length && !pick.color){ ok = false; flagMissing("color"); }
    if (!ok) return;
    addToCart(p, pick.size, pick.color, pick.qty, main);
    closeModal();
  };
  document.getElementById("viewModal").style.display = "flex";
}

function flagMissing(kind){
  document.getElementById(kind + "Err").style.display = "block";
  const row = document.getElementById(kind + "Row");
  row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
}

function changeQty(d){
  const max = (current && current.stockNum) ? current.stockNum : 99;
  pick.qty = Math.min(max, Math.max(1, pick.qty + d));
  document.getElementById("qtyVal").textContent = pick.qty;
}

function closeModal(){ document.getElementById("viewModal").style.display = "none"; }
window.addEventListener("click", e => { if (e.target.id === "viewModal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------- CARDS ---------- */
function renderProductCard(p, newestIds){
  const badges = [];
  if (p.stockNum === 0) badges.push('<span class="badge b-out">Sold out</span>');
  else {
    if (newestIds.has(p.id)) badges.push('<span class="badge b-new">New</span>');
    if (p.stockNum !== null && p.stockNum <= 3) badges.push(`<span class="badge b-low">Only ${p.stockNum} left</span>`);
  }
  if (p.condition && p.condition !== "New") badges.push(`<span class="badge b-cond">${esc(p.condition)}</span>`);

  const sw = p.colors.slice(0,5).map(c => `<span class="swatch" title="${esc(c.name)}" style="background:${esc(c.hex)}"></span>`).join("");
  const more = p.colors.length > 5 ? `<span class="mini-more">+${p.colors.length - 5}</span>` : "";
  const sz = p.sizes.slice(0,4).map(s => `<span class="mini-size">${esc(s)}</span>`).join("");
  const szMore = p.sizes.length > 4 ? `<span class="mini-more">+${p.sizes.length - 4}</span>` : "";

  const out = p.stockNum === 0;
  const label = hasOptions(p) ? '<i class="fa-solid fa-sliders"></i> Choose options' : '<i class="fa-solid fa-cart-plus"></i> Add to cart';

  return `
    <div class="product-card">
      <div class="badges">${badges.join("")}</div>
      <div class="img-wrapper" onclick="openProduct(${p.id})">
        <img src="${esc(firstImg(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER;">
      </div>
      <div class="card-details">
        <div class="cat-label">${esc(p.category || "")}</div>
        <h3>${esc(p.name)}</h3>
        <div class="product-price">KES ${money(p.price)}</div>
        <div class="mini-opts">${sw}${more}${sz}${szMore}</div>
        <div class="card-actions">
          <button class="bn bn-view" onclick="openProduct(${p.id})" aria-label="View details"><i class="fa-solid fa-eye"></i></button>
          <button class="bn bn-add" ${out ? "disabled" : ""} onclick="quickAdd(${p.id}, this)">${out ? "Sold out" : label}</button>
        </div>
      </div>
    </div>`;
}

/* ---------- SLIDER (ads from the newest products) ---------- */
function buildSlider(){
  const picks = [...allProducts].filter(p => p.images.length && p.stockNum !== 0).sort((a,b) => b.id - a.id).slice(0,5);
  const hero = document.getElementById("hero");
  if (!picks.length){ hero.style.display = "none"; return; }
  hero.style.display = "block";
  const slider = document.getElementById("slider");
  slider.innerHTML = picks.map((p,i) => `
    <div class="slide ${i === 0 ? "on" : ""}">
      <div>
        <span class="tag"><i class="fa-solid fa-fire"></i> ${i === 0 ? "Fresh on CampusDuka" : esc(p.category || "Featured")}</span>
        <h2>${esc(p.name)}</h2>
        <p>${esc(p.description || "Grab it before it's gone.")}</p>
        <div class="price-big">KES ${money(p.price)}</div>
        <button class="cta" onclick="openProduct(${p.id})">Shop now</button>
      </div>
      <div class="pic"><img src="${esc(firstImg(p))}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src=PLACEHOLDER;"></div>
    </div>`).join("") +
    `<button class="s-arrow s-prev" onclick="goSlide(-1)" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
     <button class="s-arrow s-next" onclick="goSlide(1)" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
     <div class="dots">${picks.map((_,i) => `<button class="${i === 0 ? "on" : ""}" onclick="showSlide(${i})" aria-label="Slide ${i+1}"></button>`).join("")}</div>`;
  slideIdx = 0;
  slider.onmouseenter = () => clearInterval(slideTimer);
  slider.onmouseleave = startSlides;
  startSlides();
}
function showSlide(i){
  const slides = document.querySelectorAll(".slide"), dots = document.querySelectorAll(".dots button");
  if (!slides.length) return;
  slideIdx = (i + slides.length) % slides.length;
  slides.forEach((s,k) => s.classList.toggle("on", k === slideIdx));
  dots.forEach((d,k) => d.classList.toggle("on", k === slideIdx));
}
function goSlide(d){ showSlide(slideIdx + d); }
function startSlides(){ clearInterval(slideTimer); slideTimer = setInterval(() => showSlide(slideIdx + 1), 5000); }

/* ---------- SEARCH / FILTER ---------- */
function onSearch(){
  document.getElementById("searchClear").classList.toggle("show", !!document.getElementById("searchInput").value);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(evaluateActiveFilters, 150);
}
function clearSearch(){
  document.getElementById("searchInput").value = "";
  document.getElementById("searchClear").classList.remove("show");
  evaluateActiveFilters();
}
function clearSearchEngine(){
  document.getElementById("sortDropdown").value = "newest";
  clearSearch();
  setCategoryFilter("All");
}

// Every word typed must appear somewhere in the name, category, description, sizes or colours
function matches(p, tokens){
  const hay = [p.name, p.category, p.description, p.condition, p.sizes.join(" "), p.colors.map(c => c.name).join(" ")].join(" ").toLowerCase();
  return tokens.every(t => hay.includes(t));
}

function buildCategoryNav(){
  document.getElementById("categoryNav").innerHTML = CATEGORIES.map(([name, icon]) => {
    const n = name === "All" ? allProducts.length : allProducts.filter(p => p.category === name).length;
    return `<button class="cat-btn ${selectedCategory === name ? "active" : ""}" data-category="${esc(name)}" onclick="setCategoryFilter('${name.replace(/'/g,"\\'")}')"><i class="fa-solid ${icon}"></i> ${esc(name)} <span class="n">${n}</span></button>`;
  }).join("");
}

function setCategoryFilter(category){
  selectedCategory = category;
  buildCategoryNav();
  evaluateActiveFilters();
}

function evaluateActiveFilters(){
  const searchText = document.getElementById("searchInput").value.toLowerCase().trim();
  const tokens = searchText.split(/\s+/).filter(Boolean);
  const sortValue = document.getElementById("sortDropdown").value;

  let list = selectedCategory === "All" ? [...allProducts] : allProducts.filter(p => p.category === selectedCategory);
  if (tokens.length) list = list.filter(p => matches(p, tokens));

  if (sortValue === "price-low") list.sort((a,b) => a.price - b.price);
  else if (sortValue === "price-high") list.sort((a,b) => b.price - a.price);
  else list.sort((a,b) => b.id - a.id);

  const newestIds = new Set([...allProducts].sort((a,b) => b.id - a.id).slice(0,6).map(p => p.id));
  const container = document.getElementById("product-container");

  document.getElementById("itemsCounter").innerHTML = `<strong>${list.length}</strong> item${list.length === 1 ? "" : "s"} found`;
  document.getElementById("currentFiltersApplied").innerHTML = `Category: <strong>${esc(selectedCategory)}</strong>${searchText ? ` | Search: "${esc(searchText)}"` : ""}`;

  // "Just added" strip and slider only on the plain, unfiltered view
  const plain = selectedCategory === "All" && !tokens.length;
  const fresh = [...allProducts].sort((a,b) => b.id - a.id).slice(0,8);
  document.getElementById("freshSection").style.display = plain && fresh.length >= 4 ? "block" : "none";
  document.getElementById("freshStrip").innerHTML = fresh.map(p => renderProductCard(p, newestIds)).join("");
  document.getElementById("hero").style.display = plain && document.querySelector(".slide") ? "block" : "none";

  if (!list.length){
    container.innerHTML = `
      <div class="no-results">
        <i class="fa-solid fa-basket-shopping"></i>
        <h3>No matches found</h3>
        <p>Try a different word, or check the spelling.</p>
        <button onclick="clearSearchEngine()">Clear filters</button>
      </div>`;
    return;
  }
  container.innerHTML = list.map(p => renderProductCard(p, newestIds)).join("");
}

/* ---------- LOAD ---------- */
async function loadProducts(){
  try {
    const response = await fetch("https://campusduka-api.onrender.com/products");
    if (!response.ok) throw new Error("bad response");
    allProducts = (await response.json()).map(normalize);

    const params = new URLSearchParams(window.location.search);
    const catParam = params.get("category");
    if (catParam && CATEGORIES.some(c => c[0] === catParam)) selectedCategory = catParam;
    const q = params.get("q");
    if (q){ document.getElementById("searchInput").value = q; document.getElementById("searchClear").classList.add("show"); }

    buildCategoryNav();
    buildSlider();
    evaluateActiveFilters();
  } catch (error) {
    console.error("Error connecting with data API architecture:", error);
    buildCategoryNav();
    document.getElementById("itemsCounter").innerText = "";
    document.getElementById("product-container").innerHTML = `<div class="no-results"><h3>Server connection error</h3><p>Unable to load products right now. Check your connection and refresh.</p><button onclick="location.reload()">Try again</button></div>`;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();
  buildCategoryNav();
  loadProducts();
});
</script>

</body>
