<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track My Orders | CampusDuka</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/3405/3405824.png">

  <style>
    :root {
      --primary: #0077ff;
      --primary-hover: #005ecb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-700: #334155;
      --slate-900: #0f172a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #f4f6fa; color: var(--slate-900); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ================= NAVBAR ================= */
    .navbar {
      background: var(--slate-900);
      padding: 0 40px;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border-bottom: 2px solid var(--primary);
    }

    .brand { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .logo-img { height: 44px; width: auto; display: block; }
    .logo-fallback { display: none; color: white; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    .logo-fallback i { color: var(--primary); margin-right: 6px; }
    .logo-fallback span { color: var(--primary); }

    .nav-links { display: flex; align-items: center; gap: 6px; margin-right: auto; margin-left: 20px; }
    .nav-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .nav-link:hover { color: white; background: #1e293b; }
    .nav-link.active { color: white; background: var(--primary); box-shadow: 0 4px 14px rgba(0, 119, 255, 0.35); }

    .nav-actions { display: flex; align-items: center; gap: 12px; }

    .notif-bell-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      position: relative;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .notif-bell-btn:hover { color: white; background: #334155; }

    .bell-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: bold;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 30px;
      padding: 4px 14px 4px 4px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 500;
    }
    .nav-user .mini-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--primary); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
    }
    .nav-user .nav-name { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ================= CONTAINER & PROFILE BANNER ================= */
    .container { max-width: 950px; margin: 35px auto; padding: 0 20px; }

    .profile-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-radius: 18px;
      padding: 28px 30px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
    }
    .profile-info { display: flex; align-items: center; gap: 20px; min-width: 0; }
    .avatar {
      width: 65px; height: 65px; flex-shrink: 0;
      background: var(--primary); color: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    .profile-text h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .profile-text p { color: #94a3b8; font-size: 13px; display: flex; align-items: center; gap: 6px; word-break: break-all; }
    .banner-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .active-badge {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--success);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: #94a3b8;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:hover { color: white; border-color: rgba(255,255,255,0.5); }

    /* ================= PAGE HEADER & TOOLBAR ================= */
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .page-title { font-size: 22px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 10px; }
    .sync-note { font-size: 12px; color: #64748b; display: flex; align-items: center; gap: 6px; }
    .sync-note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .sync-note.error .dot { background: var(--danger); }

    .toolbar { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .search-box { position: relative; flex: 1 1 260px; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; }
    .search-box input, .sort-select {
      width: 100%;
      border: 1px solid var(--slate-200);
      background: white;
      border-radius: 12px;
      padding: 11px 14px 11px 40px;
      font-size: 13px;
      color: var(--slate-900);
    }
    .sort-select { width: auto; padding: 11px 14px; cursor: pointer; }

    .filter-tabs { display: flex; gap: 8px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 4px; }
    .tab {
      border: 1px solid var(--slate-200);
      background: white;
      color: #475569;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 30px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .tab:hover { border-color: var(--primary); color: var(--primary); }
    .tab .count { background: var(--slate-100); color: #64748b; font-size: 11px; padding: 1px 8px; border-radius: 20px; }
    .tab.on { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 4px 14px rgba(0, 119, 255, 0.28); }
    .tab.on .count { background: rgba(255,255,255,0.25); color: white; }

    /* ================= ORDER CARDS ================= */
    .order-card {
      background: white;
      margin-bottom: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--slate-200);
      overflow: hidden;
      transition: box-shadow 0.25s ease;
    }
    .order-card:hover { box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      background: var(--slate-50);
      border-bottom: 1px solid var(--slate-100);
      flex-wrap: wrap;
    }
    .order-ref { font-size: 13px; color: #64748b; display: flex; align-items: center; gap: 8px; }
    .order-ref strong { color: var(--slate-900); }
    .copy-btn { border: none; background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px; padding: 2px 4px; }
    .copy-btn:hover { color: var(--primary); }

    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 30px;
      font-weight: 600; font-size: 12px;
    }
    .badge-pending { background: #fef3c7; color: #d97706; }
    .badge-transit { background: #e0f2fe; color: #0284c7; }
    .badge-delivered { background: #dcfce7; color: #16a34a; }

    .card-main { padding: 24px 26px 8px; display: flex; gap: 24px; }
    .order-img {
      width: 120px; height: 120px; object-fit: cover; border-radius: 14px;
      border: 1px solid var(--slate-100); background: var(--slate-50); flex-shrink: 0;
    }
    .order-details { flex-grow: 1; min-width: 0; }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
    .order-header h2 { font-size: 18px; font-weight: 600; line-height: 1.4; }
    .amount { color: var(--primary); font-weight: 700; font-size: 20px; white-space: nowrap; }

    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 14px; }
    .info { font-size: 13px; color: #475569; display: flex; align-items: flex-start; gap: 10px; }
    .info i { color: #94a3b8; font-size: 15px; width: 18px; text-align: center; margin-top: 2px; }
    .info strong { color: var(--slate-900); display: block; font-size: 12px; font-weight: 600; }

    /* ================= PROGRESS TRACKER ================= */
    .tracker { display: flex; align-items: flex-start; padding: 24px 40px 26px; }
    .t-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; font-size: 12px; font-weight: 600; color: #94a3b8; text-align: center; }
    .t-step::before {
      content: ""; position: absolute; top: 18px; right: 50%; width: 100%; height: 3px;
      background: var(--slate-200); z-index: 0;
    }
    .t-step:first-child::before { display: none; }
    .t-step.done::before, .t-step.current::before { background: var(--primary); }
    .t-dot {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--slate-100); color: #94a3b8;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; position: relative; z-index: 1;
      border: 3px solid white; box-shadow: 0 0 0 1px var(--slate-200);
    }
    .t-step.done { color: #0369a1; }
    .t-step.done .t-dot { background: #e0f2fe; color: #0369a1; box-shadow: 0 0 0 1px #bae6fd; }
    .t-step.current { color: var(--primary); }
    .t-step.current .t-dot { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(0, 119, 255, 0.4); }
    .t-step.current.final { color: #16a34a; }
    .t-step.current.final .t-dot { background: var(--success); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
    .t-step.current.final::before { background: var(--success); }
    .t-step.current:not(.final) .t-dot i { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.18); } }
    @media (prefers-reduced-motion: reduce) { .t-step.current:not(.final) .t-dot i { animation: none; } }

    /* ================= NOTIFICATIONS DRAWER ================= */
    .notification-drawer {
      position: fixed; top: 80px; right: 40px; width: 350px;
      background: white; border: 1px solid var(--slate-200); border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
      z-index: 1001; display: none; max-height: 450px; overflow-y: auto;
    }
    .notif-header {
      padding: 15px 20px; font-weight: 700; font-size: 14px;
      background: var(--slate-50); border-bottom: 1px solid var(--slate-200);
      display: flex; justify-content: space-between; align-items: center;
    }
    .notif-header button {
      border: none; background: var(--slate-100); padding: 5px 10px; font-size: 11px; font-weight: 600;
      border-radius: 6px; cursor: pointer; color: var(--slate-700); transition: background 0.2s;
    }
    .notif-header button:hover { background: var(--slate-200); }
    .notif-item { padding: 16px 20px; border-bottom: 1px solid var(--slate-100); font-size: 12px; line-height: 1.5; color: var(--slate-700); cursor: pointer; transition: background 0.2s; }
    .notif-item:hover { background: var(--slate-50); }
    .notif-item.unread { background: #eff6ff; border-left: 3px solid var(--primary); }
    .notif-item .notif-title { font-weight: 700; color: var(--slate-900); margin-bottom: 3px; }
    .notif-item .notif-time { font-size: 10px; color: #94a3b8; margin-top: 6px; }

    .no-orders {
      background: white; padding: 60px 40px; text-align: center; border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); border: 1px solid var(--slate-200); color: #64748b;
    }
    .no-orders i { font-size: 55px; color: #cbd5e1; margin-bottom: 20px; }
    .no-orders p { font-size: 16px; font-weight: 500; }
    .no-orders .shop-btn {
      display: inline-block; margin-top: 20px; background: var(--primary); color: white; text-decoration: none;
      font-size: 14px; font-weight: 600; padding: 11px 24px; border-radius: 30px; transition: background 0.2s;
    }
    .no-orders .shop-btn:hover { background: var(--primary-hover); }

    .skeleton { height: 250px; border-radius: 18px; margin-bottom: 22px; background: linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    @media(max-width: 768px) {
      .navbar { padding: 0 16px; height: 64px; }
      .logo-img { height: 38px; }
      .nav-links { margin-left: 4px; }
      .nav-link span, .nav-user .nav-name { display: none; }
      .nav-link { padding: 10px 13px; }
      .nav-user { padding: 4px; }
      .profile-banner { flex-direction: column; align-items: flex-start; }
      .banner-right { align-items: flex-start; }
      .notification-drawer { right: 16px; top: 74px; width: calc(100vw - 32px); }
    }

    @media(max-width: 650px) {
      .card-main { flex-direction: column; padding: 20px 18px 6px; }
      .card-top { padding: 12px 18px; }
      .order-img { width: 100%; height: 190px; }
      .order-header { flex-direction: column; gap: 6px; }
      .tracker { padding: 20px 8px 22px; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a class="brand" href="index2.html" aria-label="CampusDuka home">
    <img src="images/logo.png" alt="CampusDuka Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
    <span id="logoFallback" class="logo-fallback"><i class="fas fa-store"></i>Campus<span>Duka</span></span>
  </a>

  <div class="nav-links">
    <a class="nav-link" href="index2.html"><i class="fas fa-house"></i><span>Home</span></a>
    <a class="nav-link active" href="my-orders.html"><i class="fas fa-box"></i><span>My Orders</span></a>
  </div>

  <div class="nav-actions">
    <div class="notif-bell-btn" onclick="toggleNotifications()" role="button" tabindex="0" aria-label="Notifications">
      <i class="fas fa-bell"></i>
      <span id="notif-count" class="bell-badge" style="display: none;">0</span>
    </div>
    <div class="nav-user" title="Signed in">
      <div class="mini-avatar" id="navAvatar">C</div>
      <span class="nav-name" id="navName">Shopper</span>
    </div>
  </div>
</nav>

<!-- Sliding System Notification Drawer -->
<div id="notif-drawer" class="notification-drawer">
  <div class="notif-header">
    <span>System Alerts & Order Tracks</span>
    <button onclick="clearNotifications()">Clear All</button>
  </div>
  <div id="notif-list-container">
    <div class="notif-item" style="text-align: center; color: #94a3b8; padding: 30px;">No new notifications.</div>
  </div>
</div>

<div class="container">

  <!-- Profile Welcome Banner -->
  <div class="profile-banner">
    <div class="profile-info">
      <div class="avatar" id="buyerAvatar">C</div>
      <div class="profile-text">
        <h2 id="buyerWelcomeName">Welcome, Campus Shopper 👋</h2>
        <p><i class="fas fa-envelope"></i> Signed in as: <span id="buyerDisplayEmail">...</span></p>
      </div>
    </div>
    <div class="banner-right">
      <div class="active-badge" id="activeOrderCount">Checking Active Orders...</div>
      <button class="logout-btn" onclick="clearBuyerSession()" title="On a shared or campus lab computer? Log out here so the next person can't see your orders.">
        <i class="fas fa-user-slash"></i> Not you? Log out
      </button>
    </div>
  </div>

  <div class="page-head">
    <h1 class="page-title"><i class="fas fa-box" style="color: var(--primary);"></i> My Orders</h1>
    <div class="sync-note" id="syncNote"><span class="dot"></span><span id="syncText">Updating...</span></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="search" id="orderSearch" placeholder="Search by item, order number or location" oninput="renderOrders()">
    </div>
    <select class="sort-select" id="orderSort" onchange="renderOrders()" aria-label="Sort orders">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="high">Price: high to low</option>
      <option value="low">Price: low to high</option>
    </select>
  </div>

  <div class="filter-tabs" id="filterTabs"></div>

  <div id="ordersList"><div class="skeleton"></div><div class="skeleton"></div></div>
</div>

<script>
let syncInterval = null;
const FALLBACK_IMAGE = 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=300';

// In-app notifications persistence store
let buyerNotifications = [];

// Orders held in memory so search / filter / sort don't need a new fetch
let allOrders = [];
let activeFilter = "all";
let lastSynced = null;

// Preparing and shipping are now one "In Transit" stage.
const STAGES = [
  { key: "pending",   label: "Pending",    icon: "fa-clock",         badge: "badge-pending" },
  { key: "transit",   label: "In Transit", icon: "fa-truck-fast",    badge: "badge-transit" },
  { key: "delivered", label: "Delivered",  icon: "fa-circle-check",  badge: "badge-delivered" }
];

function stageOf(rawStatus) {
  const s = String(rawStatus || "pending").toLowerCase();
  if (s === "delivered") return 2;
  if (s === "preparing" || s === "out_for_delivery" || s === "shipping" || s === "transit" || s === "in_transit") return 1;
  return 0;
}

function esc(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// This page requires being logged in. The buyer is identified by the EMAIL
// of the account they signed in with — not by the phone number used to pay
// (which can legitimately be a friend's number or a different SIM).
function getSessionUser() {
  try {
    return JSON.parse(localStorage.getItem("user"));
  } catch (err) {
    return null;
  }
}

// The signed-in buyer's email, lowercased so it always matches the server.
function getBuyerEmail() {
  const user = getSessionUser();
  return user && user.email ? String(user.email).trim().toLowerCase() : "";
}

// Notifications are stored per account email on this device.
function notifStorageKey() {
  return `buyer_notifs_${getBuyerEmail()}`;
}

function cleanPostgresArray(imgStr) {
  if (!imgStr) return null;
  if (Array.isArray(imgStr)) return imgStr[0] || null;

  let cleaned = imgStr.replace(/[{}]/g, '');
  let arr = cleaned.split(',');
  return arr[0] ? arr[0].replace(/"/g, '').trim() : null;
}

// Play notification sound chime when order status updates
function playNotifySound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = "sine";
    // Play a delightful double beep
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 key
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    osc.start();

    setTimeout(() => {
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 key
    }, 80);

    osc.stop(audioCtx.currentTime + 0.25);
  } catch(e) {
    console.log("Audio contexts pending interaction permission restrictions.");
  }
}

// Render dynamic elements for Notification Center
function syncNotificationsUI() {
  const container = document.getElementById("notif-list-container");
  const countBadge = document.getElementById("notif-count");

  if (buyerNotifications.length === 0) {
    container.innerHTML = `<div class="notif-item" style="text-align: center; color: #94a3b8; padding: 30px;">No new tracking alerts.</div>`;
    countBadge.style.display = "none";
    return;
  }

  const unreadCount = buyerNotifications.filter(n => n.unread).length;
  if (unreadCount > 0) {
    countBadge.innerText = unreadCount;
    countBadge.style.display = "flex";
  } else {
    countBadge.style.display = "none";
  }

  container.innerHTML = buyerNotifications.map((n, idx) => `
    <div class="notif-item ${n.unread ? 'unread' : ''}" onclick="markAsRead(${idx})">
      <div class="notif-title">${n.title}</div>
      <div>${n.message}</div>
      <div class="notif-time">${n.timestamp}</div>
    </div>
  `).join('');
}

function appendNotification(title, message) {
  buyerNotifications.unshift({
    title,
    message,
    timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
    unread: true
  });
  localStorage.setItem(notifStorageKey(), JSON.stringify(buyerNotifications));
  syncNotificationsUI();
  playNotifySound();
}

function markAsRead(idx) {
  buyerNotifications[idx].unread = false;
  localStorage.setItem(notifStorageKey(), JSON.stringify(buyerNotifications));
  syncNotificationsUI();
}

function clearNotifications() {
  buyerNotifications = [];
  localStorage.removeItem(notifStorageKey());
  syncNotificationsUI();
}

function toggleNotifications() {
  const drawer = document.getElementById("notif-drawer");
  drawer.style.display = drawer.style.display === "block" ? "none" : "block";
}

// FEATURE: now that this page requires login, "not you" fundamentally
// means logging out — otherwise the next person on a shared device would
// still see this account's orders, since localStorage("user") persists
// until someone actually logs out.
function clearBuyerSession() {
  if (!confirm("This logs you out on this device so the next person here can't see your orders. Continue?")) return;
  const email = getBuyerEmail();
  if (email) {
    localStorage.removeItem(`status_cache_${email}`);
    localStorage.removeItem(`buyer_notifs_${email}`);
  }
  localStorage.removeItem("buyerPhone");
  localStorage.removeItem("buyerName");
  localStorage.removeItem("user");
  window.location.href = "login.html";
}

function copyOrderId(id, btn) {
  const done = () => { btn.innerHTML = '<i class="fas fa-check"></i>'; setTimeout(() => btn.innerHTML = '<i class="far fa-copy"></i>', 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(String(id)).then(done).catch(() => {});
}

function setFilter(key) {
  activeFilter = key;
  renderOrders();
}

function orderTime(order) {
  const t = new Date(order.created_at || order.date);
  return isNaN(t) ? 0 : t.getTime();
}

function orderAmount(order) {
  return Number(order.amount || order.product_price || 0);
}

// Draws filter tabs + order cards from the in-memory list
function renderOrders() {
  const container = document.getElementById("ordersList");
  if (!allOrders.length) return;

  const counts = { all: allOrders.length, 0: 0, 1: 0, 2: 0 };
  allOrders.forEach(o => counts[stageOf(o.delivery_status)]++);

  const tabs = [{ key: "all", label: "All" }, { key: "0", label: "Pending" }, { key: "1", label: "In Transit" }, { key: "2", label: "Delivered" }];
  document.getElementById("filterTabs").innerHTML = tabs.map(t => `
    <button class="tab ${activeFilter === t.key ? 'on' : ''}" onclick="setFilter('${t.key}')">
      ${t.label} <span class="count">${counts[t.key]}</span>
    </button>`).join('');

  const q = document.getElementById("orderSearch").value.trim().toLowerCase();
  const sort = document.getElementById("orderSort").value;

  let list = allOrders.filter(o => activeFilter === "all" || String(stageOf(o.delivery_status)) === activeFilter);
  if (q) {
    list = list.filter(o => {
      const name = o.product_name || (o.product && o.product.name) || "";
      return `${name} ${o.id} ${o.delivery_location || ""}`.toLowerCase().includes(q);
    });
  }

  list.sort((a, b) => {
    if (sort === "old") return orderTime(a) - orderTime(b);
    if (sort === "high") return orderAmount(b) - orderAmount(a);
    if (sort === "low") return orderAmount(a) - orderAmount(b);
    return orderTime(b) - orderTime(a);
  });

  if (!list.length) {
    container.innerHTML = `
    <div class="no-orders">
        <i class="fas fa-magnifying-glass"></i>
        <p>No orders match your search or filter.</p>
    </div>`;
    return;
  }

  container.innerHTML = list.map(order => {
    const stage = stageOf(order.delivery_status);
    const st = STAGES[stage];

    let productName = esc(order.product_name || (order.product && order.product.name) || "Item Purchased");
    let productPrice = orderAmount(order).toLocaleString();
    let deliveryLocation = esc(order.delivery_location && order.delivery_location !== "null" ? order.delivery_location : "Not Specified");
    let paymentStatus = esc(order.payment_status && order.payment_status !== "null" ? order.payment_status : "Pending");

    // Timestamp parsing
    let formattedDateTime = "Unrecorded";
    let timeSource = order.created_at || order.date;
    if (timeSource) {
        const parsedDate = new Date(timeSource);
        if (!isNaN(parsedDate)) {
            formattedDateTime = parsedDate.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            }) + " at " + parsedDate.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }
    }

    let productImage = FALLBACK_IMAGE;
    let databaseImage = cleanPostgresArray(order.product_images || order.image || (order.product && order.product.images));
    if (databaseImage && databaseImage !== "null" && databaseImage.trim() !== "") {
        productImage = databaseImage;
    }

    const tracker = STAGES.map((s, i) => {
      let cls = i < stage ? "done" : (i === stage ? "current" : "");
      if (i === stage && stage === 2) cls += " final";
      return `<div class="t-step ${cls}"><div class="t-dot"><i class="fas ${s.icon}"></i></div>${s.label}</div>`;
    }).join('');

    return `
    <div class="order-card">
        <div class="card-top">
            <div class="order-ref">
                <i class="fas fa-hashtag"></i> Order <strong>${esc(order.id)}</strong>
                <button class="copy-btn" title="Copy order number" onclick="copyOrderId('${esc(order.id)}', this)"><i class="far fa-copy"></i></button>
            </div>
            <span class="status-badge ${st.badge}">
              <i class="fas ${st.icon}" style="font-size: 12px;"></i> ${st.label}
            </span>
        </div>

        <div class="card-main">
            <img src="${esc(productImage)}" class="order-img" alt="${productName}" onerror="this.onerror=null; this.src='${FALLBACK_IMAGE}';">
            <div class="order-details">
                <div class="order-header">
                    <h2>${productName}</h2>
                    <div class="amount">KES ${productPrice}</div>
                </div>
                <div class="info-grid">
                    <div class="info"><i class="far fa-calendar-alt"></i> <span><strong>Placed</strong>${formattedDateTime}</span></div>
                    <div class="info"><i class="fas fa-map-marker-alt"></i> <span><strong>Delivery location</strong>${deliveryLocation}</span></div>
                    <div class="info"><i class="far fa-credit-card"></i> <span><strong>Payment</strong>${paymentStatus}</span></div>
                </div>
            </div>
        </div>

        <!-- Live Status Tracker -->
        <div class="tracker">${tracker}</div>
    </div>`;
  }).join('');
}

function setSyncNote(ok) {
  const note = document.getElementById("syncNote");
  note.classList.toggle("error", !ok);
  document.getElementById("syncText").innerText = ok
    ? `Live · updated ${lastSynced.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`
    : "Couldn't refresh. Retrying...";
}

async function loadOrders() {
    // The signed-in account's EMAIL is the only source of truth for whose
    // orders to show. Checkout deliberately allows paying from a different
    // phone than the account's (e.g. a friend's number), so the phone used
    // to pay must never decide whose orders these are.
    const sessionUser = getSessionUser();
    const email = getBuyerEmail();
    const buyerName = (sessionUser && sessionUser.fullname) || "Valued Shopper";

    // Set Profile UI Elements
    document.getElementById("buyerWelcomeName").innerText = `Welcome, ${buyerName} 👋`;
    document.getElementById("buyerDisplayEmail").innerText = email || "None";
    document.getElementById("buyerAvatar").innerText = buyerName.charAt(0).toUpperCase();
    document.getElementById("navAvatar").innerText = buyerName.charAt(0).toUpperCase();
    document.getElementById("navName").innerText = buyerName.split(" ")[0];

    if (!email) {
        document.getElementById("ordersList").innerHTML = `
        <div class="no-orders">
            <i class="fas fa-user-lock"></i>
            <p>Your account doesn't have an email on file, so orders can't be matched to it. Please log out and sign in again.</p>
        </div>`;
        document.getElementById("activeOrderCount").style.display = "none";
        return;
    }

    localStorage.setItem("buyerName", buyerName);

    try {
        const response = await fetch(`https://campusduka-api.onrender.com/orders/by-email/${encodeURIComponent(email)}`);
        if (!response.ok) throw new Error("Database fetch error.");

        const orders = await response.json();
        const container = document.getElementById("ordersList");

        lastSynced = new Date();
        setSyncNote(true);

        if (!orders || orders.length === 0) {
            allOrders = [];
            document.getElementById("activeOrderCount").innerText = "0 Active Orders";
            document.getElementById("filterTabs").innerHTML = "";
            container.innerHTML = `
            <div class="no-orders">
                <i class="fas fa-shopping-bag"></i>
                <p>You haven't placed any orders yet!</p>
                <a class="shop-btn" href="index2.html">Start shopping</a>
            </div>`;
            return;
        }

        const activeCount = orders.filter(o => stageOf(o.delivery_status) < 2).length;
        document.getElementById("activeOrderCount").innerText = `${activeCount} Active Order${activeCount === 1 ? '' : 's'} · ${orders.length} Total`;

        // Retrieve historical tracking log to monitor for modifications.
        // Old caches stored raw statuses, so both sides are compared as stages.
        let historicalStatusMap = JSON.parse(localStorage.getItem(`status_cache_${email}`)) || {};
        let newStatusMap = {};

        orders.forEach(order => {
            const stage = stageOf(order.delivery_status);
            newStatusMap[order.id] = STAGES[stage].key;

            // Detect if status changed dynamically since last polling cycle!
            if (historicalStatusMap[order.id] && stageOf(historicalStatusMap[order.id]) !== stage) {
                appendNotification(
                  "Order Status Shifted!",
                  `Your order for "${esc(order.product_name || 'Item')}" has progressed to: ${STAGES[stage].label.toUpperCase()}`
                );
            }
        });

        allOrders = orders;
        renderOrders();

        // Save current statuses as base-state cache for future polling checks
        localStorage.setItem(`status_cache_${email}`, JSON.stringify(newStatusMap));

    } catch(err) {
        console.error("Live fetch error sync failure:", err);
        if (lastSynced) setSyncNote(false);
        else document.getElementById("syncText").innerText = "Couldn't load orders. Retrying...";
    }
}

window.onload = () => {
    // FEATURE: require login before showing anything. A guest was
    // previously able to reach this page and see whatever phone number
    // was left over from a past checkout — now only a signed-in account's
    // own orders can ever be shown here.
    if (!getSessionUser()) {
      alert("Please log in to view your orders.");
      window.location.href = "login.html?redirect=my-orders.html";
      return;
    }

    // Sync initial notifications database from local storage
    const storedNotifs = localStorage.getItem(notifStorageKey());
    if (storedNotifs) {
      buyerNotifications = JSON.parse(storedNotifs);
    }

    loadOrders();
    syncNotificationsUI();

    if(syncInterval) clearInterval(syncInterval);
    syncInterval = setInterval(loadOrders, 10000);
};
</script>
