<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Login | CampusDuka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
/* ==========================
   MODERN PREMIUM UI THEME
========================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f8fafc;
  color: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px;
}

.box {
  width: 100%;
  max-width: 440px;
  background: white;
  padding: 40px 35px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
  border: 1px solid #e2e8f0;
}

.brand-header {
  text-align: center;
  margin-bottom: 30px;
}

.brand-header i {
  font-size: 36px;
  color: #003366;
  margin-bottom: 12px;
}

.brand-header h2 {
  font-size: 26px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.5px;
}

.brand-header h2 span {
  color: #003366;
}

.brand-header p {
  font-size: 14px;
  color: #64748b;
  margin-top: 6px;
}

/* ================= FORM ARCHITECTURE ================= */
.form-group {
  margin-bottom: 18px;
  position: relative;
}

.form-group i {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 13px 14px 13px 42px;
  background: #f8fafc;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 14px;
  color: #0f172a;
  outline: none;
  transition: all 0.2s ease;
}

input:focus {
  border-color: #003366;
  background: white;
  box-shadow: 0 0 0 4px rgba(0, 51, 102, 0.1);
}

/* ================= SUBMIT AND REDIRECTS ================= */
button {
  width: 100%;
  padding: 14px;
  background: #003366;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 25px;
}

button:hover {
  background: #002244;
  box-shadow: 0 4px 12px rgba(0, 51, 102, 0.2);
}

.box p.register-redirect {
  text-align: center;
  font-size: 14px;
  color: #64748b;
  margin-top: 20px;
}

.box p.register-redirect a {
  color: #003366;
  text-decoration: none;
  font-weight: 600;
}

.box p.register-redirect a:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="box">
  <div class="brand-header">
    <i class="fas fa-store-lines"></i>
    <h2>Campus<span>Duka</span></h2>
    <p>Sign in to manage your merchant portal</p>
  </div>

  <!-- EMAIL -->
  <div class="form-group">
    <i class="fas fa-envelope"></i>
    <input id="email" type="email" placeholder="Email Address">
  </div>

  <!-- PASSWORD -->
  <div class="form-group">
    <i class="fas fa-lock"></i>
    <input id="password" type="password" placeholder="Password">
  </div>

  <!-- LOGIN TRIGGER -->
  <button onclick="sellerLogin()">
    <i class="fas fa-right-to-bracket"></i> Login
  </button>

  <p class="register-redirect">
    Don't have a merchant account? <a href="seller-register.html">Register here</a>
  </p>
</div>

<script>
async function sellerLogin(){
  try{
    const data={
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    };

    const response = await fetch(
      "https://campusduka-api.onrender.com/seller-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }
    );

    const result = await response.json();

    if(result.success){
      localStorage.setItem(
        "seller",
        JSON.stringify(result.seller)
      );
      alert("Login successful");
      window.location.href = "seller-dashboard.html";
    }else{
      alert(result.message);
    }
  }catch(error){
    console.log(error);
    alert("Something went wrong");
  }
}
</script>

</body>
</html>
