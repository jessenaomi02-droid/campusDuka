<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusDuka | Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{
  --color-charcoal:#1f2d3d; --color-slate-teal:#164e63; --color-medium-teal:#1f6b88; --color-accent-blue:#4589be;
  --bg-main:#f8fafc; --text-dark:#1f2d3d; --text-muted:#64748b; --card-bg:#fff; --border-light:#e2e8f0;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-md:0 4px 6px -1px rgba(31,45,61,.08),0 2px 4px -1px rgba(31,45,61,.04);
  --shadow-lg:0 10px 20px -3px rgba(31,45,61,.12),0 4px 6px -4px rgba(31,45,61,.08);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;background:var(--bg-main);color:var(--text-dark);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--color-accent-blue);outline-offset:2px}

/* NAVBAR */
.navbar{background:var(--color-charcoal);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 5%;height:70px;position:sticky;top:0;z-index:1000;border-bottom:2px solid var(--color-slate-teal);box-shadow:0 4px 15px rgba(0,0,0,.15)}
.logo-link{display:flex;align-items:center;flex-shrink:0}
.logo-img{height:44px;width:auto;display:block}
.logo-fallback{display:none;align-items:center;gap:10px}
.logo-svg{height:38px;width:auto}
.logo-text{color:#fff;font-size:22px;font-weight:800;letter-spacing:-.5px}
.logo-text span{color:var(--color-accent-blue)}
.nav-links{display:flex;gap:8px;list-style:none;margin:0 auto 0 24px;padding:0}
.nav-links a{color:rgba(255,255,255,.8);font-weight:500;font-size:14px;padding:9px 16px;border-radius:10px;display:block;transition:all .2s}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-links a.active{color:#fff;background:var(--color-slate-teal)}
.menu-icon{display:none;color:#fff;font-size:22px;cursor:pointer}
.cart-link{position:relative;color:#fff;display:flex;align-items:center;gap:10px;background:var(--color-slate-teal);padding:10px 18px;border-radius:30px;font-size:14px;font-weight:600;transition:background .2s}
.cart-link:hover{background:var(--color-medium-teal)}
.cart-link i{font-size:18px}
#eventCartCount{background:#ef4444;color:#fff;border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-size:11px;font-weight:700}
.cart-link.pulse{animation:cartPulse .6s ease 3}
@keyframes cartPulse{50%{transform:scale(1.12)}}

/* HERO SLIDER */
.hero{max-width:1200px;margin:24px auto 0;padding:0 20px}
.slider{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--color-charcoal),var(--color-slate-teal));color:#fff;min-height:290px;box-shadow:var(--shadow-lg)}
.slide{display:none;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding:34px 56px;min-height:290px}
.slide.on{display:grid;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide .tag{display:inline-block;background:rgba(255,255,255,.15);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px}
.slide h2{font-size:30px;font-weight:800;margin:0 0 10px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide p{margin:0 0 16px;color:rgba(255,255,255,.8);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .price-big{font-size:24px;font-weight:800;margin-bottom:16px}
.slide .cta{background:#fff;color:var(--color-slate-teal);border:none;padding:12px 26px;border-radius:30px;font-weight:700;font-size:14px;transition:transform .2s}
.slide .cta:hover{transform:translateY(-2px)}
.slide .pic{height:230px;display:flex;align-items:center;justify-content:center}
.slide .pic img{max-width:100%;max-height:230px;object-fit:contain;border-radius:16px;background:rgba(255,255,255,.95);padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.s-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:50%}
.s-arrow:hover{background:rgba(255,255,255,.35)}
.s-prev{left:12px}.s-next{right:12px}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.dots button{width:9px;height:9px;border-radius:50%;border:none;background:rgba(255,255,255,.4);padding:0}
.dots button.on{background:#fff;width:24px;border-radius:6px}

/* SEARCH & FILTERS */
.search-section{max-width:760px;margin:28px auto 0;padding:0 20px}
.search-box{display:flex;background:#fff;padding:6px;border-radius:50px;box-shadow:var(--shadow-md);border:1px solid var(--border-light);align-items:center}
.search-box:focus-within{border-color:var(--color-slate-teal);box-shadow:0 0 0 3px rgba(22,78,99,.15)}
.search-box i.sf{margin-left:20px;color:var(--text-muted)}
.search-box input{flex:1;min-width:0;padding:12px 14px;border:none;outline:none;font-family:inherit;font-size:15px;background:transparent;color:var(--text-dark)}
.search-clear{display:none;border:none;background:var(--border-light);color:var(--text-muted);width:30px;height:30px;border-radius:50%;margin-right:6px}
.search-clear.show{display:block}
.filter-row{max-width:1200px;margin:18px auto 0;padding:0 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--border-light);padding:8px 16px;border-radius:30px;font-size:13px;font-weight:600;color:var(--text-dark);transition:all .2s;white-space:nowrap}
.chip:hover,.chip.on{background:var(--color-slate-teal);color:#fff;border-color:var(--color-slate-teal)}
.sort-select{margin-left:auto;border:1px solid var(--border-light);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:13px;background:#fff;color:var(--text-dark)}
.results-strip{max-width:1200px;margin:16px auto 0;padding:0 20px;font-size:14px;color:var(--text-muted)}
.results-strip strong{color:var(--text-dark)}

/* EVENTS GRID */
.product-container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:26px;padding:16px 20px 60px}
.grid-msg{grid-column:1/-1;text-align:center;padding:14px;color:var(--text-muted);font-weight:500}
.product-card{background:var(--card-bg);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);display:flex;flex-direction:column;position:relative;transition:transform .25s,box-shadow .25s}
.product-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.event-price-badge{position:absolute;top:12px;right:12px;background:var(--color-slate-teal);color:#fff;padding:6px 12px;font-weight:700;border-radius:var(--radius-sm);font-size:12px;z-index:5;box-shadow:var(--shadow-md)}
.event-price-badge.free{background:#10b981}
.status-badge{position:absolute;top:12px;left:12px;color:#fff;padding:4px 10px;font-size:11px;font-weight:700;border-radius:6px;z-index:5}
.sb-soon{background:#f59e0b}.sb-low{background:#ef4444}.sb-out{background:#64748b}
.in-cart{position:absolute;bottom:12px;left:12px;background:#10b981;color:#fff;padding:4px 10px;font-size:11px;font-weight:700;border-radius:6px;z-index:5;display:none}
.in-cart.show{display:block}
.img-wrapper{width:100%;height:200px;overflow:hidden;background:#f1f5f9;cursor:pointer;position:relative}
.img-wrapper img{width:100%;height:100%;object-fit:contain;transition:transform .35s}
.product-card:hover .img-wrapper img{transform:scale(1.05)}
.card-details{padding:18px 20px 20px;display:flex;flex-direction:column;flex-grow:1}
.date-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--color-medium-teal);margin-bottom:6px}
.product-card h3{font-size:17px;font-weight:700;margin:0 0 8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text-muted);font-size:13px;line-height:1.5;height:38px;margin-bottom:16px}
.card-actions{display:flex;gap:8px;margin-top:auto}
.bn{background:var(--color-slate-teal);color:#fff;border:none;padding:11px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.bn:hover{background:var(--color-medium-teal)}
.bn:disabled{background:#cbd5e1;cursor:not-allowed}
.bn-secondary{background:#e2e8f0;color:var(--text-dark);border:none;width:44px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;transition:background .2s}
.bn-secondary:hover{background:#cbd5e1}
.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);background:#fff;border-radius:var(--radius-lg);border:1px dashed var(--border-light)}
.no-results i{font-size:48px;margin-bottom:15px;opacity:.5}
.no-results h3{color:var(--text-dark);margin:0 0 8px}
.no-results button{margin-top:14px;background:var(--color-slate-teal);color:#fff;border:none;padding:9px 22px;border-radius:var(--radius-sm);font-weight:600;font-size:14px}
.skel{height:380px;border-radius:16px;background:linear-gradient(90deg,#eef2f7 25%,#f8fafc 50%,#eef2f7 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);justify-content:center;align-items:center;z-index:2000;padding:16px}
.modal-content{background:#fff;padding:25px;width:100%;max-width:500px;max-height:92dvh;overflow-y:auto;border-radius:var(--radius-lg);position:relative;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
.close-btn{position:absolute;right:16px;top:12px;width:34px;height:34px;border-radius:50%;border:none;background:#fff;font-size:22px;color:var(--text-muted);z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#mainImage{width:100%;height:auto;max-height:320px;object-fit:contain;border-radius:var(--radius-md);background:#f1f5f9;display:block}
.thumbnail-container{margin-top:12px;display:flex;justify-content:center;gap:8px}
.thumbnail-container img{width:60px;height:60px;border-radius:var(--radius-sm);cursor:pointer;object-fit:contain;background:#f1f5f9;border:2px solid transparent}
.thumbnail-container img.on{border-color:var(--color-slate-teal)}
.modal-info{margin-top:16px}
.modal-info h3{font-size:21px;font-weight:700;margin:0 0 6px;line-height:1.35}
.modal-price{color:var(--color-slate-teal);font-weight:800;font-size:22px;margin-bottom:10px}
.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modal-meta span{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;background:rgba(69,137,190,.15);color:var(--color-medium-teal)}
.modal-desc{color:var(--text-muted);font-size:14px;line-height:1.7;white-space:pre-line;word-break:break-word;margin-bottom:16px}
.buy-row{display:flex;gap:12px;align-items:center}
.qty{display:flex;align-items:center;border:1.5px solid var(--border-light);border-radius:10px;overflow:hidden}
.qty button{width:36px;height:42px;border:none;background:#f8fafc;font-size:16px;font-weight:700}
.qty button:hover{background:var(--border-light)}
.qty span{min-width:34px;text-align:center;font-weight:700;font-size:14px}
.modal-add{padding:13px}

footer{background:var(--color-charcoal);color:#fff;text-align:center;padding:24px;font-size:14px;border-top:3px solid var(--color-slate-teal)}

/* LOADER, TOAST, CART POINTER, FLY */
#pageLoader{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:5000}
#pageLoader.show{display:flex}
#pageLoader i{font-size:42px;color:#fff}
#cartPointer{position:fixed;z-index:4000;display:none;flex-direction:column;align-items:center;cursor:pointer;animation:pointBounce .7s ease-in-out infinite}
#cartPointer.show{display:flex}
#cartPointer i{font-size:34px;color:#facc15;filter:drop-shadow(0 0 8px #facc15)}
#cartPointer span{background:#facc15;color:#1f2d3d;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
@keyframes pointBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:var(--color-charcoal);color:#fff;padding:12px 14px 12px 20px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;opacity:0;visibility:hidden;z-index:4000;transition:all .35s;max-width:calc(100vw - 32px)}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#toast i{color:#10b981}
#toast a{background:var(--color-accent-blue);color:#fff;padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap}
.fly{position:fixed;z-index:4500;width:60px;height:60px;object-fit:cover;border-radius:12px;pointer-events:none;box-shadow:var(--shadow-lg);transition:all .75s cubic-bezier(.5,-.2,.7,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:820px){
  .slide{grid-template-columns:1fr;padding:26px 24px 44px;text-align:center}
  .slide .pic{order:-1;height:140px}.slide .pic img{max-height:140px}
  .slide h2{font-size:22px}
  .s-arrow{display:none}
}
@media(max-width:768px){
  .navbar{padding:0 16px;height:64px}
  .menu-icon{display:block;order:3}
  .nav-links{display:none;position:absolute;top:64px;left:0;width:100%;background:var(--color-charcoal);flex-direction:column;padding:16px;gap:6px;margin:0;border-bottom:2px solid var(--color-slate-teal)}
  .nav-links.active{display:flex}
  .nav-links a{text-align:center}
  .cart-label{display:none}
  .cart-link{padding:10px 14px;margin-left:auto}
  .logo-img{height:38px}
  .sort-select{margin-left:0}
}
@media(max-width:550px){
  .product-container{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="pageLoader"><i class="fas fa-spinner fa-spin"></i></div>
<div id="cartPointer" onclick="location.href='event_cart.html'"><i class="fas fa-arrow-up"></i><span>Your tickets · tap to view</span></div>
<div id="toast"><i class="fa-solid fa-ticket"></i><span id="toastMsg"></span><a href="event_cart.html">View tickets</a></div>

<nav class="navbar">
  <a href="index2.html" class="logo-link" aria-label="CampusDuka home">
    <img src="images/logo.png" alt="CampusDuka Logo" class="logo-img" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
    <span id="logoFallback" class="logo-fallback">
      <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#164e63"/><stop offset="100%" stop-color="#4589be"/></linearGradient></defs>
        <rect x="20" y="25" width="60" height="50" rx="8" fill="url(#logo-grad)"/>
        <polygon points="50,15 20,25 80,25" fill="#ffffff"/>
        <circle cx="50" cy="50" r="10" fill="#ffffff"/>
        <path d="M44,50 L56,50 M50,44 L50,56" stroke="url(#logo-grad)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Campus<span>Duka</span></span>
    </span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index2.html">Home</a></li>
    <li><a href="products.html">Products</a></li>
    <li><a href="food.html">Fast Foods</a></li>
    <li><a href="events.html" class="active">Events</a></li>
  </ul>
  <a href="event_cart.html" class="cart-link" id="cartLink" title="View your ticket cart" aria-label="Open your ticket cart">
    <i class="fa-solid fa-ticket"></i><span class="cart-label">Tickets</span>
    <span id="eventCartCount">0</span>
  </a>
  <div class="menu-icon" id="menuIcon" aria-label="Menu"><i class="fas fa-bars"></i></div>
</nav>

<section class="hero" id="hero">
  <div class="slider" id="slider">
    <div class="slide on">
      <div>
        <span class="tag"><i class="fa-solid fa-calendar-star"></i> Campus Events</span>
        <h2>Discover plans, tech meetups, festivals & campus life</h2>
        <p>Book your ticket in a few taps.</p>
      </div>
      <div class="pic"><img src="images/event1.jpg" alt="Campus events" onerror="this.style.display='none'"></div>
    </div>
  </div>
</section>

<section class="search-section">
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass sf"></i>
    <input type="search" id="eventSearch" placeholder="Search events by name or keyword..." autocomplete="off" oninput="onSearch()">
    <button class="search-clear" id="searchClear" onclick="clearSearch()" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
  </div>
</section>

<div class="filter-row" id="filterRow">
  <button class="chip on" data-f="all" onclick="setFilter('all',this)">All events</button>
  <button class="chip" data-f="free" onclick="setFilter('free',this)">Free</button>
  <button class="chip" data-f="paid" onclick="setFilter('paid',this)">Paid</button>
  <button class="chip" data-f="week" id="weekChip" style="display:none" onclick="setFilter('week',this)">Next 7 days</button>
  <select id="sortDropdown" class="sort-select" onchange="evaluate()" aria-label="Sort events">
    <option value="soon">Most upcoming</option>
    <option value="price-low">Price: Low to High</option>
    <option value="price-high">Price: High to Low</option>
  </select>
</div>
<div class="results-strip" id="resultsStrip"></div>

<div class="product-container" id="product-container">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div>

<div class="modal" id="viewModal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
    <img id="mainImage" alt="Main View Image">
    <div id="thumbnails" class="thumbnail-container"></div>
    <div class="modal-info">
      <h3 id="modalName"></h3>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="buy-row">
        <div class="qty"><button onclick="changeQty(-1)" aria-label="Fewer">-</button><span id="qtyVal">1</span><button onclick="changeQty(1)" aria-label="More">+</button></div>
        <button class="bn modal-add" id="modalAddBtn"><i class="fa-solid fa-ticket"></i> Book Ticket</button>
      </div>
    </div>
  </div>
</div>

<footer>&copy; 2026 CampusDuka • All Rights Reserved</footer>

<script>
const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#f1f5f9"/><text x="50%" y="52%" font-family="Arial" font-size="16" fill="#94a3b8" text-anchor="middle">No image</text></svg>');
let rawEventsData = [];
let activeFilter = "all", openItem = null, qty = 1, cameFromSearch = false;
let slideIdx = 0, slideTimer = null, searchTimer;

function esc(v){ return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){ return Number(n || 0).toLocaleString(); }
function keyOf(p){ return p._id || p.id || ""; }
function imgsOf(p){ return p.images.length ? p.images : [PLACEHOLDER]; }
function toList(v){
  if (!v) return [];
  if (Array.isArray(v)) return v;
  if (typeof v === "string") return v.replace(/^\{|\}$/g, "").split(",").map(x => x.replace(/^"|"$/g, "").trim()).filter(Boolean);
  return [];
}
function dateOf(p){ if (!p.date) return null; const d = new Date(p.date); return isNaN(d) ? null : d; }
function dayState(p){            // upcoming / past / none
  const d = dateOf(p); if (!d) return "none";
  const end = new Date(d); end.setHours(23,59,59,999);
  return end < new Date() ? "past" : "upcoming";
}
function daysAway(p){ const d = dateOf(p); return d ? Math.ceil((d - new Date()) / 86400000) : null; }
function prettyDate(p){
  const d = dateOf(p); if (!d) return "";
  return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
}

document.getElementById("menuIcon").onclick = () => document.getElementById("navLinks").classList.toggle("active");

/* ===== PAGE LOADER ===== */
function showPageLoader(){ document.getElementById("pageLoader").classList.add("show"); setTimeout(hidePageLoader, 10000); }
function hidePageLoader(){ document.getElementById("pageLoader").classList.remove("show"); }
window.addEventListener("pageshow", hidePageLoader);
// Any link to another page shows the loader and blocks extra clicks
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a || a.target === "_blank" || e.ctrlKey || e.metaKey) return;
  const h = a.getAttribute("href");
  if (!h || h.startsWith("#") || /^(javascript|mailto|tel):/.test(h)) return;
  showPageLoader();
});

/* ===== TOAST, ARROW TO CART, FLY ===== */
let toastTimer, pointerTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}
function pointToCart(){
  const cartIcon = document.getElementById("cartLink");
  const p = document.getElementById("cartPointer");
  const r = cartIcon.getBoundingClientRect();
  p.classList.add("show");
  const left = Math.min(Math.max(8, r.left + r.width / 2 - p.offsetWidth / 2), innerWidth - p.offsetWidth - 8);
  p.style.left = left + "px";
  p.style.top = (r.bottom + 10) + "px";
  cartIcon.classList.remove("pulse"); void cartIcon.offsetWidth; cartIcon.classList.add("pulse");
  clearTimeout(pointerTimer);
  pointerTimer = setTimeout(() => { p.classList.remove("show"); cartIcon.classList.remove("pulse"); }, 4500);
}
function flyToCart(srcEl, imgSrc){
  if (!srcEl) return;
  const a = srcEl.getBoundingClientRect(), b = document.getElementById("cartLink").getBoundingClientRect();
  const f = document.createElement("img");
  f.src = imgSrc; f.className = "fly";
  f.style.left = (a.left + a.width / 2 - 30) + "px";
  f.style.top = (a.top + a.height / 2 - 30) + "px";
  document.body.appendChild(f);
  requestAnimationFrame(() => {
    f.style.left = (b.left + b.width / 2 - 15) + "px";
    f.style.top = (b.top + b.height / 2 - 15) + "px";
    f.style.width = f.style.height = "30px";
    f.style.opacity = ".4";
  });
  setTimeout(() => f.remove(), 800);
}

/* ===== TICKET CART (eventCart, same shape as before) ===== */
function getEventCart(){ try { return JSON.parse(localStorage.getItem("eventCart")) || []; } catch(e){ return []; } }
function updateEventCartBadge(){
  document.getElementById("eventCartCount").innerText = getEventCart().reduce((s, i) => s + (i.quantity || 1), 0);
}
function ticketsInCart(p){
  return getEventCart().filter(i => String(i.id) === String(keyOf(p))).reduce((s, i) => s + (i.quantity || 1), 0);
}
function refreshInCart(){
  document.querySelectorAll(".in-cart").forEach(el => {
    const p = rawEventsData.find(x => String(keyOf(x)) === el.dataset.id);
    const n = p ? ticketsInCart(p) : 0;
    el.textContent = `${n} ticket${n === 1 ? "" : "s"} in cart`;
    el.classList.toggle("show", n > 0);
  });
}
function bookTicket(id, btn, amount){
  const p = rawEventsData.find(x => String(keyOf(x)) === String(id));
  if (!p) return;
  amount = amount || 1;
  const cart = getEventCart();
  const pid = keyOf(p);
  const existing = cart.find(i => String(i.id) === String(pid));
  if (existing) existing.quantity += amount;
  else cart.push({ id: pid, name: p.name || "", price: p.price, category: "Events", image: p.images[0] || "", quantity: amount });
  localStorage.setItem("eventCart", JSON.stringify(cart));
  updateEventCartBadge();
  refreshInCart();
  const src = btn && btn.closest(".product-card") ? btn.closest(".product-card").querySelector(".img-wrapper img") : document.getElementById("mainImage");
  flyToCart(src, imgsOf(p)[0]);
  showToast(`${amount > 1 ? amount + " × " : ""}"${p.name}" ticket added`);
  pointToCart();
}

/* ===== PROMO SLIDER (next few events) ===== */
function buildSlider(){
  const picks = rawEventsData.filter(p => dayState(p) !== "past" && p.stockNum !== 0).slice(0, 5);
  if (!picks.length) return;
  const slider = document.getElementById("slider");
  slider.innerHTML = picks.map((p, i) => {
    const free = p.price === 0;
    return `
    <div class="slide ${i === 0 ? "on" : ""}">
      <div>
        <span class="tag"><i class="fa-solid fa-calendar-day"></i> ${esc(prettyDate(p) || (i === 0 ? "Featured event" : "Don't miss out"))}</span>
        <h2>${esc(p.name)}</h2>
        <p>${esc(p.description || "Book your ticket in a few taps.")}</p>
        <div class="price-big">${free ? "Free entry" : "KES " + money(p.price)}</div>
        <button class="cta" onclick="viewEvent('${esc(keyOf(p))}')">Get tickets</button>
      </div>
      <div class="pic"><img src="${esc(imgsOf(p)[0])}" alt="${esc(p.name)}" onerror="this.onerror=null;this.src=PLACEHOLDER;"></div>
    </div>`; }).join("") +
    `<button class="s-arrow s-prev" onclick="showSlide(slideIdx-1)" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
     <button class="s-arrow s-next" onclick="showSlide(slideIdx+1)" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
     <div class="dots">${picks.map((_, i) => `<button class="${i === 0 ? "on" : ""}" onclick="showSlide(${i})" aria-label="Slide ${i + 1}"></button>`).join("")}</div>`;
  slideIdx = 0;
  slider.onmouseenter = () => clearInterval(slideTimer);
  slider.onmouseleave = startSlides;
  startSlides();
}
function showSlide(i){
  const slides = document.querySelectorAll(".slide"), dots = document.querySelectorAll(".dots button");
  if (!slides.length) return;
  slideIdx = (i + slides.length) % slides.length;
  slides.forEach((s, k) => s.classList.toggle("on", k === slideIdx));
  dots.forEach((d, k) => d.classList.toggle("on", k === slideIdx));
}
function startSlides(){ clearInterval(slideTimer); slideTimer = setInterval(() => showSlide(slideIdx + 1), 5000); }

/* ===== CARDS ===== */
function statusBadge(p){
  const st = dayState(p), n = daysAway(p);
  if (st === "past") return '<span class="status-badge sb-out">Ended</span>';
  if (p.stockNum === 0) return '<span class="status-badge sb-out">Sold out</span>';
  if (p.stockNum !== null && p.stockNum <= 5) return `<span class="status-badge sb-low">Only ${p.stockNum} left</span>`;
  if (n !== null && n <= 7) return `<span class="status-badge sb-soon">${n <= 0 ? "Today" : n === 1 ? "Tomorrow" : "In " + n + " days"}</span>`;
  return "";
}
function cardHTML(p){
  const free = p.price === 0;
  const key = esc(keyOf(p));
  const blocked = p.stockNum === 0 || dayState(p) === "past";
  const when = prettyDate(p);
  return `
    <div class="product-card">
      <div class="event-price-badge ${free ? "free" : ""}">${free ? "Free" : "KES " + money(p.price)}</div>
      ${statusBadge(p)}
      <div class="img-wrapper" onclick="viewEvent('${key}')">
        <span class="in-cart" data-id="${key}"></span>
        <img src="${esc(imgsOf(p)[0])}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER;">
      </div>
      <div class="card-details">
        ${when ? `<div class="date-row"><i class="fa-regular fa-calendar"></i> ${esc(when)}</div>` : ""}
        <h3>${esc(p.name)}</h3>
        <small>${esc(p.description || "No additional details provided for this event.")}</small>
        <div class="card-actions">
          <button class="bn-secondary" title="View details" onclick="viewEvent('${key}')" aria-label="View details"><i class="fa-solid fa-images"></i></button>
          <button class="bn" ${blocked ? "disabled" : ""} onclick="bookTicket('${key}', this)">${blocked ? (dayState(p) === "past" ? "Ended" : "Sold out") : '<i class="fa-solid fa-ticket"></i> Book Ticket'}</button>
        </div>
      </div>
    </div>`;
}

/* ===== MODAL ===== */
function viewEvent(id){
  const p = rawEventsData.find(x => String(keyOf(x)) === String(id));
  if (!p) return;
  openItem = p; qty = 1;
  const images = imgsOf(p);
  const main = document.getElementById("mainImage");
  const thumbs = document.getElementById("thumbnails");
  main.src = images[0];
  thumbs.innerHTML = "";
  if (images.length > 1) images.forEach((src, i) => {
    const t = document.createElement("img");
    t.src = src; if (i === 0) t.className = "on";
    t.onclick = () => { main.src = src; thumbs.querySelectorAll("img").forEach(x => x.classList.remove("on")); t.classList.add("on"); };
    thumbs.appendChild(t);
  });
  document.getElementById("modalName").textContent = p.name;
  document.getElementById("modalPrice").textContent = p.price === 0 ? "Free" : "KES " + money(p.price);
  const meta = [];
  if (prettyDate(p)) meta.push(`<i class="fa-regular fa-calendar"></i> ${esc(prettyDate(p))}`);
  if (p.stockNum !== null && p.stockNum > 0) meta.push(`<i class="fa-solid fa-ticket"></i> ${p.stockNum} ticket${p.stockNum === 1 ? "" : "s"} left`);
  document.getElementById("modalMeta").innerHTML = meta.map(m => `<span>${m}</span>`).join("");
  document.getElementById("modalDesc").textContent = p.description || "No additional details provided for this event.";
  document.getElementById("qtyVal").textContent = 1;
  const blocked = p.stockNum === 0 || dayState(p) === "past";
  const btn = document.getElementById("modalAddBtn");
  btn.disabled = blocked;
  btn.innerHTML = blocked ? (dayState(p) === "past" ? "Ended" : "Sold out") : '<i class="fa-solid fa-ticket"></i> Book Ticket';
  btn.onclick = () => { bookTicket(keyOf(p), null, qty); closeModal(); };
  document.getElementById("viewModal").style.display = "flex";
}
function changeQty(d){
  const max = (openItem && openItem.stockNum) ? openItem.stockNum : 20;
  qty = Math.min(max, Math.max(1, qty + d));
  document.getElementById("qtyVal").textContent = qty;
}
function closeModal(){ document.getElementById("viewModal").style.display = "none"; }
window.addEventListener("click", e => { if (e.target.id === "viewModal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ===== SEARCH (live filter, tolerant of small typos) ===== */
function levenshteinDistance(a, b){
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...new Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  return dp[a.length][b.length];
}
function isCloseWordMatch(word, target){
  if (target.includes(word) || word.includes(target)) return true;
  return word.length > 3 && levenshteinDistance(word, target) <= (target.length <= 4 ? 1 : 2);
}
function eventMatches(ev, query){
  const hay = `${ev.name} ${ev.description || ""}`.toLowerCase();
  if (hay.includes(query)) return true;
  const hayWords = hay.split(/\W+/).filter(Boolean);
  return query.split(/\s+/).filter(Boolean).every(w => hayWords.some(h => isCloseWordMatch(w, h)));
}
function onSearch(){
  cameFromSearch = false;
  document.getElementById("searchClear").classList.toggle("show", !!document.getElementById("eventSearch").value);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(evaluate, 150);
}
function clearSearch(){
  document.getElementById("eventSearch").value = "";
  document.getElementById("searchClear").classList.remove("show");
  cameFromSearch = false;
  evaluate();
}
function setFilter(f, el){
  activeFilter = f;
  document.querySelectorAll("#filterRow .chip").forEach(c => c.classList.toggle("on", c === el));
  evaluate();
}
function resetAll(){
  document.getElementById("sortDropdown").value = "soon";
  setFilter("all", document.querySelector('#filterRow .chip[data-f="all"]'));
  clearSearch();
}

// Upcoming dated events first (soonest at the top), then undated (newest first), then ended
function soonOrder(a, b){
  const rank = p => ({ upcoming:0, none:1, past:2 })[dayState(p)];
  if (rank(a) !== rank(b)) return rank(a) - rank(b);
  if (rank(a) === 0) return dateOf(a) - dateOf(b);
  if (rank(a) === 2) return dateOf(b) - dateOf(a);
  return String(keyOf(b)).localeCompare(String(keyOf(a)), undefined, { numeric:true });
}

function evaluate(){
  const query = document.getElementById("eventSearch").value.toLowerCase().trim();
  const sort = document.getElementById("sortDropdown").value;
  const container = document.getElementById("product-container");

  let list = [...rawEventsData];
  if (activeFilter === "free") list = list.filter(p => p.price === 0);
  else if (activeFilter === "paid") list = list.filter(p => p.price > 0);
  else if (activeFilter === "week") list = list.filter(p => dayState(p) === "upcoming" && daysAway(p) <= 7);

  let note = "";
  if (query){
    const found = list.filter(p => eventMatches(p, query));
    if (found.length) list = found;
    else if (cameFromSearch && list.length) note = `No exact match for "${esc(query)}", so here are all upcoming events.`;
    else list = [];
  }

  if (sort === "price-low") list.sort((a, b) => a.price - b.price);
  else if (sort === "price-high") list.sort((a, b) => b.price - a.price);
  else list.sort(soonOrder);

  document.getElementById("resultsStrip").innerHTML = `<strong>${list.length}</strong> event${list.length === 1 ? "" : "s"} found${query ? ` for "${esc(query)}"` : ""}`;

  if (!list.length){
    container.innerHTML = `
      <div class="no-results">
        <i class="fa-solid fa-calendar-xmark"></i>
        <h3>No upcoming events found</h3>
        <p>Try a different word or clear your filters.</p>
        <button onclick="resetAll()">Clear filters</button>
      </div>`;
    return;
  }
  container.innerHTML = (note ? `<div class="grid-msg">${note}</div>` : "") + list.map(cardHTML).join("");
  refreshInCart();
}

/* ===== LOAD FROM API ===== */
async function loadProducts(){
  try {
    const response = await fetch("https://campusduka-api.onrender.com/products");
    if (!response.ok) throw new Error("bad response");
    const products = await response.json();
    rawEventsData = products.filter(p => p.category === "Events").map(p => {
      p.images = toList(p.images);
      p.price = Number(p.price) || 0;
      p.stockNum = (p.stock === undefined || p.stock === null || p.stock === "") ? null : Number(p.stock);
      return p;
    });
    rawEventsData.sort(soonOrder);

    // The "Next 7 days" filter only appears when events carry dates
    if (rawEventsData.some(p => dateOf(p))) document.getElementById("weekChip").style.display = "";

    buildSlider();

    // Search sent from the homepage: ?search=concert
    const incoming = new URLSearchParams(location.search).get("search");
    if (incoming){
      document.getElementById("eventSearch").value = incoming;
      document.getElementById("searchClear").classList.add("show");
      cameFromSearch = true;   // show everything instead of a blank page if nothing matches
    }
    evaluate();
  } catch (error) {
    console.error("Error reading events from backend api:", error);
    document.getElementById("product-container").innerHTML = `
      <div class="no-results">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <h3>Connection Error</h3>
        <p>Could not connect to the campus event pipeline. Please refresh in a moment.</p>
        <button onclick="location.reload()">Try again</button>
      </div>`;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  updateEventCartBadge();
  loadProducts();
});
</script>
